<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aanvragen — Copywriter For You</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body{min-height:100vh;background:var(--tint)}
    .admin-shell{width:min(1180px,100% - 40px);margin:0 auto;padding:48px 0 72px}
    .admin-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:32px}
    .admin-head h1{font-family:var(--font-display);font-size:clamp(2.4rem,5vw,4.4rem);line-height:1}
    .admin-head p{margin-top:12px;color:var(--muted)}
    .admin-note{padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--paper);margin-bottom:20px}
    .orders{display:grid;gap:14px}
    .order{border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:22px}
    .order-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
    .order h2{font-size:1.05rem}
    .order-meta{color:var(--muted);font-size:.88rem;margin-top:4px}
    .order-status{border-radius:999px;background:var(--tint);padding:6px 10px;font-size:.78rem;font-weight:800;white-space:nowrap}
    .order-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
    .order-grid dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .order-grid dd{margin-top:3px;overflow-wrap:anywhere}
    .order-message{margin-top:18px;padding-top:16px;border-top:1px solid var(--line-soft);white-space:pre-wrap}
    .empty{color:var(--muted);padding:32px 0}
    @media (max-width:640px){
      .admin-shell{width:min(100% - 28px,1180px);padding-top:28px}
      .admin-head{display:block}
      .admin-head .btn{margin-top:20px;width:100%}
      .order-grid{grid-template-columns:1fr 1fr}
    }
  </style>
</head>
<body>
  <main class="admin-shell">
    <header class="admin-head">
      <div>
        <p class="kicker kicker-nr">Privé overzicht</p>
        <h1>Aanvragen</h1>
        <p>Alleen zichtbaar na server-side authenticatie.</p>
      </div>
      <a class="btn btn-primary" href="/">Terug naar website</a>
    </header>
    <p class="admin-note">Dit is een lokaal beheeroverzicht. Gebruik HTTPS en sterke, afzonderlijke admin-gegevens voordat je dit publiek host.</p>
    <section id="orders" class="orders" aria-live="polite">
      <p class="empty">Aanvragen laden…</p>
    </section>
  </main>
  <script>
    const orders = document.querySelector("#orders");
    const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[char]));
    const formatDate = value => {
      try { return new Intl.DateTimeFormat("nl-NL", {dateStyle:"medium", timeStyle:"short"}).format(new Date(value)); }
      catch { return value || "Onbekend"; }
    };
    fetch("/api/admin/requests", {headers: {"Accept":"application/json"}})
      .then(response => response.ok ? response.json() : Promise.reject(new Error("Laden mislukt")))
      .then(({requests}) => {
        if (!requests.length) {
          orders.innerHTML = '<p class="empty">Er zijn nog geen aanvragen.</p>';
          return;
        }
        orders.innerHTML = requests.map(order => `
          <article class="order">
            <div class="order-top">
              <div><h2>${escapeHtml(order.name)} · ${escapeHtml(order.id)}</h2>
              <p class="order-meta">${escapeHtml(formatDate(order.receivedAt))} · ${escapeHtml(order.type)}</p></div>
              <span class="order-status">${escapeHtml(order.status)}</span>
            </div>
            <dl class="order-grid">
              <div><dt>E-mail</dt><dd><a href="mailto:${escapeHtml(order.email)}">${escapeHtml(order.email)}</a></dd></div>
              <div><dt>Telefoon</dt><dd><a href="tel:${escapeHtml(order.phone)}">${escapeHtml(order.phone || "—")}</a></dd></div>
              <div><dt>Dienst</dt><dd>${escapeHtml(order.service || "Contact")}</dd></div>
              <div><dt>Datum</dt><dd>${escapeHtml(order.date || "—")}</dd></div>
              <div><dt>Dagdeel</dt><dd>${escapeHtml(order.time || "—")}</dd></div>
              <div><dt>Bedrijf</dt><dd>${escapeHtml(order.company || "—")}</dd></div>
            </dl>
            <p class="order-message">${escapeHtml(order.message)}</p>
          </article>`).join("");
      })
      .catch(() => { orders.innerHTML = '<p class="empty">Aanvragen konden niet worden geladen.</p>'; });
  </script>
</body>
</html>
